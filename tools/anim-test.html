<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test: Behandlungs-Animationen</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .grid h2 { font-size: .8rem; letter-spacing: .1em; margin: 0 0 6px; }
  </style>
</head>
<body>
  <p>Entwickler-Vorschau aller Animationen der Preisliste. Nicht verlinkt. Parameter <code>?t=2.5</code> springt zu Sekunde 2,5 und hält an.</p>
  <div class="grid" id="grid"></div>
  <script src="../vendor/gsap.min.js"></script>
  <script type="module">
    import { createScene } from "../js/treatments.js";
    const types = ["needling","nano","derma","peeling","combo","bright","classic","massage","massage-long",
      "nail-new","nail-fill","nail-french","nail-shellac","nail-mani","nail-remove","nail-art","nail-repair",
      "toe-shellac","toe-lack","toe-model","toe-care"];
    const t = parseFloat(new URLSearchParams(location.search).get("t"));
    const grid = document.getElementById("grid");
    window.scenes = types.map((type) => {
      const box = document.createElement("div");
      box.innerHTML = `<h2>${type}</h2><figure class="treat__anim" data-anim="${type}"></figure>`;
      grid.appendChild(box);
      const s = createScene(box.querySelector("figure"));
      if (isNaN(t)) s.play(); else s.seek(t);
      return s;
    });
  </script>
</body>
</html>
